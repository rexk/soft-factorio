name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the privacy scan reads every commit message
      - name: Unit tests and privacy scan
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
        run: python3 tools/check.py
